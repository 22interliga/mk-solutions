<style>
:root{
  --bg:#0A111E;--panel:#0C1626;--card:#111E33;--card2:#0F1B2E;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.055);
  --text:#EAF0F8;--muted:#93A0B4;--dim:#6B7A90;
  --blue:#2E74E6;--blue2:#4C8DF7;--blue-050:rgba(46,116,230,.13);
  --silver:#C3CCD8;
  --ok:#22C55E;--warn:#F59E0B;--danger:#EF4444;--info:#3B82F6;--gold:#F5B301;
  --radius:14px;--font:"Inter",system-ui,sans-serif;--display:"Sora",var(--font);--mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.01em}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
.muted{color:var(--muted)}.small{font-size:12.5px}.xs{font-size:11px}
button{font-family:inherit;cursor:pointer}

.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--line2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.sb-brand img{width:38px;height:38px;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.sb-brand b{font-family:var(--display);font-weight:700;font-size:15px;display:block;line-height:1.1}
.sb-brand span{color:var(--dim);font-size:11px}
.sb-nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;transition:.13s;border:none;background:none;text-align:left;width:100%;position:relative}
.nav-item:hover{background:var(--card);color:#fff}
.nav-item.active{background:var(--blue-050);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--blue2);border-radius:0 3px 3px 0}
.nav-ic{width:18px;text-align:center;opacity:.9}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.sb-foot{padding:12px;border-top:1px solid var(--line2);color:var(--dim);font-size:11px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(10,17,30,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.topbar .menu{display:none;background:none;border:none;color:var(--text);font-size:20px}
.crumb{font-family:var(--display);font-weight:600;font-size:15px;flex:1}
.live-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.content{padding:22px;max-width:1200px;width:100%}

.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.page-head h1{font-size:22px}.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.page-actions{margin-left:auto;display:flex;gap:8px}

.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.14s}
.btn:hover{border-color:var(--blue2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.primary{background:linear-gradient(180deg,var(--blue2),var(--blue));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border-color:transparent;color:#04310f}
.btn.ghost{background:none}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.stat{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:15px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue2)}
.stat.ok::after{background:var(--ok)}.stat.warn::after{background:var(--warn)}.stat.danger::after{background:var(--danger)}.stat.gold::after{background:var(--gold)}
.stat .v{font-family:var(--display);font-size:25px;font-weight:800;line-height:1}
.stat .l{color:var(--muted);font-size:12px;margin-top:6px}

.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h3{font-size:15px;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:.1s}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:rgba(255,255,255,.03)}
.table-scroll{overflow-x:auto}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ativo{background:rgba(34,197,94,.15);color:#4ade80}.b-inativo{background:rgba(148,163,184,.15);color:#94a3b8}
.b-disp{background:rgba(59,130,246,.15);color:#60a5fa}.b-aceito{background:rgba(245,179,1,.15);color:#f5c542}
.b-rota{background:rgba(46,116,230,.18);color:#7aa8ff}.b-entregue{background:rgba(34,197,94,.15);color:#4ade80}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:16px}
.chip.ok{background:rgba(34,197,94,.14);color:#4ade80}.chip.warn{background:rgba(245,158,11,.15);color:#fbbf24}.chip.bad{background:rgba(239,68,68,.15);color:#f87171}

.avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;font-family:var(--display);flex:0 0 auto}
.who{display:flex;align-items:center;gap:10px}
.who .n{font-weight:600}.who .s{color:var(--dim);font-size:11.5px}

.score{font-family:var(--mono);font-weight:600}
.bar{height:7px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--blue2))}

/* ranking podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.pod{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;position:relative}
.pod.p1{border-color:rgba(245,179,1,.5)}.pod.p2{border-color:rgba(195,204,216,.4)}.pod.p3{border-color:rgba(205,127,50,.45)}
.pod .medal{font-size:26px}.pod .pname{font-weight:700;font-family:var(--display);margin:6px 0 2px}
.pod .psc{font-family:var(--mono);font-size:22px;font-weight:700}
.pod .p1c{color:var(--gold)}

/* ofensores */
.off{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.off-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.viol{display:flex;flex-wrap:wrap;gap:8px}
.viol .v{display:flex;flex-direction:column;gap:2px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:7px 11px}
.viol .v b{color:#f87171;font-family:var(--mono)}.viol .v span{font-size:11px;color:var(--muted)}

/* ao vivo */
.live-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.map{background:radial-gradient(circle at 30% 20%,rgba(46,116,230,.12),transparent 60%),var(--card2);border:1px solid var(--line);border-radius:var(--radius);position:relative;height:420px;overflow:hidden;background-size:100% 100%,26px 26px;background-image:radial-gradient(circle at 30% 20%,rgba(46,116,230,.1),transparent 60%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px)}
.mk-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--blue2);box-shadow:0 0 0 4px rgba(76,141,247,.25),0 0 12px rgba(76,141,247,.6);transition:left 1.6s linear,top 1.6s linear;transform:translate(-50%,-50%)}
.mk-dot .lbl{position:absolute;left:16px;top:-4px;white-space:nowrap;font-size:10px;font-weight:600;background:rgba(10,17,30,.8);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.trk{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.trk-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.route{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:7px}
.route b{color:var(--text)}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:20px;transition:width 1.4s linear}
.trk-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--dim)}

/* fretes */
.link-box{display:flex;align-items:center;gap:10px;background:rgba(46,116,230,.07);border:1px dashed rgba(76,141,247,.4);border-radius:12px;padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
.link-box code{font-family:var(--mono);font-size:12.5px;color:var(--blue2);background:rgba(0,0,0,.25);padding:6px 10px;border-radius:7px;flex:1;min-width:180px;overflow:auto}
.freight-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.fcol-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;display:flex;gap:7px;align-items:center}
.fcard{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.fcard .fr{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:6px}
.fcard .fmeta{font-size:11.5px;color:var(--muted);line-height:1.7}
.fcard .fval{font-family:var(--mono);color:#4ade80;font-weight:600}
.fcard .factions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* notif */
.notif{display:flex;gap:11px;padding:12px 6px;border-bottom:1px solid var(--line2);cursor:default}
.notif.unread{background:linear-gradient(90deg,var(--blue-050),transparent);border-radius:8px;padding-left:10px}
.n-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.n-frete{background:var(--blue2)}.n-entrega{background:var(--ok)}.n-ocorrencia{background:var(--danger)}.n-ofensor{background:var(--warn)}.n-motorista{background:var(--info)}
.notif .msg{font-size:13.5px;font-weight:500}

.empty{text-align:center;color:var(--dim);padding:34px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.control{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;width:100%}
.control:focus{border-color:var(--blue2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.modal-ov{position:fixed;inset:0;background:rgba(6,11,20,.66);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:100;opacity:0;transition:.18s}
.modal-ov.show{opacity:1}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;transform:translateY(8px);transition:.18s}
.modal-ov.show .modal{transform:none}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:16px}.modal-h button{background:none;border:none;color:var(--muted);font-size:22px}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}

.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.ind{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:10px;padding:11px}
.ind .il{font-size:11px;color:var(--muted)}.ind .iv{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0E1A2C;border:1px solid var(--line);color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;box-shadow:0 20px 50px -18px #000;opacity:0;transform:translateY(10px);transition:.22s}
.toast.show{opacity:1;transform:none}

.sb-scrim{display:none}
@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:80%;max-width:290px;z-index:60;transform:translateX(-105%);transition:.22s}
  .shell.open .sidebar{transform:none}
  .shell.open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(6,11,20,.5);z-index:50}
  .topbar .menu{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.live-grid{grid-template-columns:1fr}
  .freight-cols{grid-template-columns:1fr 1fr}
  .podium{grid-template-columns:1fr}
}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.freight-cols{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
</style>
</head>

function avatar(name,cls){const a=el("span",{class:"avatar"+(cls?" "+cls:""),text:initials(name).toUpperCase()});a.style.background=`hsl(${hue(name)} 55% 45%)`;return a;}

/* ---------- toast ---------- */
let tw;function toast(m){if(!tw){tw=el("div",{class:"toast-wrap"});document.body.appendChild(tw);}
  const t=el("div",{class:"toast"},m);tw.appendChild(t);requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),250);},2400);}

/* ---------- modal ---------- */
function modal(title,body,actions){
  const ov=el("div",{class:"modal-ov"});
  const foot=el("div",{class:"modal-f"});
  const close=()=>{ov.classList.remove("show");setTimeout(()=>ov.remove(),180);};
  (actions||[]).forEach(a=>foot.appendChild(el("button",{class:"btn "+(a.cls||"ghost"),onclick:()=>a.on?a.on(close):close()},a.label)));
  const box=el("div",{class:"modal"},[
    el("div",{class:"modal-h"},[el("h3",{},title),el("button",{html:"&times;",onclick:close})]),
    el("div",{class:"modal-b"},[body]), foot]);
  ov.appendChild(box);ov.addEventListener("mousedown",e=>{if(e.target===ov)close();});
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add("show"));return{close};
}

function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);_id=s._id||_id;["drivers","freights","entregas","despesas","notifications"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});return s;}}catch(e){}

function reset(){state=seed();persist();}

/* ---- cálculos de indicadores ---- */
const maxEntregas=()=>Math.max(1,...state.drivers.map(d=>d.entregas));
function score(d){
  const prod=d.entregas/maxEntregas()*100;
  let s=d.sla*.35 + d.pont*.25 + (d.qualidade/5*100)*.20 + prod*.20 - d.ocorrencias*2;
  return Math.max(0,Math.min(100,Math.round(s)));
}
const TH={sla:85,pont:80,ocorrencias:3,qualidade:3.5}; // limites (abaixo/acima = ofensa)
function violations(d){
  const v=[];
  if(d.sla<TH.sla)v.push({k:"SLA",val:d.sla+"%",lim:"mín "+TH.sla+"%"});
  if(d.pont<TH.pont)v.push({k:"Pontualidade",val:d.pont+"%",lim:"mín "+TH.pont+"%"});
  if(d.ocorrencias>TH.ocorrencias)v.push({k:"Ocorrências",val:d.ocorrencias,lim:"máx "+TH.ocorrencias});
  if(d.qualidade<TH.qualidade)v.push({k:"Qualidade",val:d.qualidade.toFixed(1),lim:"mín "+TH.qualidade.toFixed(1)});
  return v;
}
const ranked=()=>state.drivers.filter(d=>d.status==="ativo").map(d=>({d,sc:score(d)})).sort((a,b)=>b.sc-a.sc);
const offenders=()=>state.drivers.filter(d=>d.status==="ativo"&&violations(d).length).map(d=>({d,v:violations(d)})).sort((a,b)=>b.v.length-a.v.length);

/* ---- SLA por período + filtros ---- */
function slaQuery(f){ // f={ini,fim,motorista,base,localidade}
  let list=state.entregas.slice();
  if(f.ini)list=list.filter(e=>e.data>=f.ini);
  if(f.fim)list=list.filter(e=>e.data<=f.fim);
  if(f.motorista)list=list.filter(e=>e.motorista===f.motorista);
  if(f.base)list=list.filter(e=>e.base===f.base);
  if(f.localidade)list=list.filter(e=>e.localidade===f.localidade);
  const total=list.length, noPrazo=list.filter(e=>e.noPrazo).length;
  const pct=total?Math.round(noPrazo/total*100):0;
  // quebra por motorista
  const porMot={};
  list.forEach(e=>{(porMot[e.motorista]=porMot[e.motorista]||{t:0,ok:0}); porMot[e.motorista].t++; if(e.noPrazo)porMot[e.motorista].ok++;});
  return {total,noPrazo,atrasadas:total-noPrazo,pct,porMot,list};
}

/* ---- aniversariantes ---- */
function birthdayInfo(d){
  if(!d.nascimento)return null;
  const [_,mm,dd]=d.nascimento.split("-");const t=new Date();
  const tm=String(t.getMonth()+1).padStart(2,"0"),td=String(t.getDate()).padStart(2,"0");
  // dias até o próximo aniversário
  let next=new Date(t.getFullYear(),+mm-1,+dd);
  if(next< new Date(t.getFullYear(),t.getMonth(),t.getDate()))next=new Date(t.getFullYear()+1,+mm-1,+dd);
  const days=Math.round((next-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);
  return {isToday:(mm===tm&&dd===td),days,label:dd+"/"+mm};
}
const aniversariantes=(within=7)=>state.drivers.map(d=>({d,b:birthdayInfo(d)})).filter(x=>x.b&&(x.b.isToday||x.b.days<=within)).sort((a,b)=>a.b.days-b.b.days);
function waBirthday(d){
  const msg=encodeURIComponent(`Feliz aniversário, ${d.name.split(" ")[0]}! 🎉 A equipe MK-Solutions e a transportadora desejam um dia excelente pra você. Obrigado por fazer parte da nossa operação!`);
  return `https://wa.me/${(d.phone||"").replace(/\D/g,"")}?text=${msg}`;
}

    stat(r.total,"Entregas",""),
    stat(r.noPrazo,"No prazo","ok"),
    stat(r.atrasadas,"Atrasadas",r.atrasadas?"danger":""),
  ]));
  // quebra por motorista
  const card=el("div",{class:"card"},[el("div",{class:"card-head"},[el("h3",{text:"SLA por motorista (no filtro)"})])]);
  const ids=Object.keys(r.porMot).sort((a,b)=>(r.porMot[b].ok/r.porMot[b].t)-(r.porMot[a].ok/r.porMot[a].t));
  if(!ids.length)card.appendChild(el("div",{class:"empty",text:"Nenhuma entrega no filtro selecionado."}));
  ids.forEach(id=>{const d=driverById(id);if(!d)return;const p=Math.round(r.porMot[id].ok/r.porMot[id].t*100);
    card.appendChild(el("div",{style:"display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2)"},[
      avatar(d.name),el("div",{style:"flex:1"},[el("div",{style:"font-weight:600",text:d.name}),el("div",{class:"xs muted",text:r.porMot[id].ok+"/"+r.porMot[id].t+" no prazo"})]),
      bar(p),el("span",{class:"chip "+(p>=85?"ok":p>=70?"warn":"bad"),text:p+"%"})]));
  });
  w.appendChild(card);
  return w;
};

V.notificacoes=function(){
  const w=el("div");w.appendChild(pageHead("Notificações da operação","Eventos dos processos em curso",[el("button",{class:"btn sm",onclick:()=>{state.notifications.forEach(n=>n.read=true);persist();render();}},"Marcar lidas")]));
  const card=el("div",{class:"card"});
  if(!state.notifications.length)card.appendChild(el("div",{class:"empty",text:"Sem notificações."}));
  state.notifications.forEach(n=>card.appendChild(el("div",{class:"notif"+(n.read?"":" unread")},[
    el("span",{class:"n-dot n-"+n.type}),el("div",{},[el("div",{class:"msg",text:n.msg}),el("div",{class:"xs muted",text:ago(n.at)+" atrás"})])])));
  w.appendChild(card);
  return w;
};

/* ---- form helpers ---- */
function inp(ph,type,val){return el("input",{class:"control",placeholder:ph||"",type:type||"text",value:val!=null?val:""});}
function sel(arr,val){const s=el("select",{class:"control"});arr.forEach(o=>{const op=el("option",{value:o},o);if(val!=null&&String(o)===String(val))op.selected=true;s.appendChild(op);});return s;}
function field(l,c){return el("div",{class:"field"},[el("label",{text:l}),c]);}

/* =========================================================================
   NAV + ROUTER
   ========================================================================= */
const NAV=[
  {id:"dashboard",label:"Visão geral",ic:"◧",view:"dashboard"},
  {id:"motoristas",label:"Motoristas",ic:"◎",view:"motoristas"},
  {id:"ranking",label:"Ranking",ic:"★",view:"ranking"},
  {id:"ofensores",label:"Ofensores",ic:"⚠",view:"ofensores"},
  {id:"aovivo",label:"Ao vivo",ic:"◉",view:"aovivo"},
  {id:"fretes",label:"Fretes disponíveis",ic:"▦",view:"fretes"},
  {id:"sla",label:"SLA",ic:"◕",view:"sla"},
  {id:"despesas",label:"Despesas",ic:"▤",view:"despesas"},
  {id:"notificacoes",label:"Notificações",ic:"◈",view:"notificacoes"},
];
let route="dashboard";
function buildNav(){
  const nav=clear($("#nav"));
  NAV.forEach(it=>{
    const badge=it.id==="notificacoes"&&unread()?el("span",{class:"nav-badge",text:unread()}):null;
    nav.appendChild(el("button",{class:"nav-item"+(it.id===route?" active":""),onclick:()=>{route=it.id;$("#shell").classList.remove("open");render();}},
      [el("span",{class:"nav-ic",text:it.ic}),el("span",{style:"flex:1",text:it.label}),badge]));
  });
}
function render(){
  buildNav();
  const it=NAV.find(x=>x.id===route)||NAV[0];
  $("#crumb").textContent=it.label;
  const c=clear($("#content"));
  c.appendChild(V[it.view]());
  c.scrollTop=0;
}

/* ---- simulação "ao vivo": avança rotas periodicamente ---- */
setInterval(()=>{
  if(document.querySelector(".modal-ov"))return; // não interrompe formulários/telas abertas
  let changed=false;
  state.freights.filter(f=>f.status==="rota").forEach(f=>{
    if(f.progresso<95){f.progresso=Math.min(95,f.progresso+Math.round(3+Math.random()*6));changed=true;}
  });
  // a conclusão da entrega é ação da transportadora (botão "Concluir entrega"),
  // por isso as rotas NÃO se encerram sozinhas — o painel ao vivo segue informando.
  if(changed){persist();
    if(route==="aovivo"||route==="dashboard")render();
  }
},2600);

/* ---- boot ---- */
$("#menu").addEventListener("click",()=>$("#shell").classList.toggle("open"));
$("#scrim").addEventListener("click",()=>$("#shell").classList.remove("open"));
render();
})();
</script>
</body>
